
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b3b75">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nutrition">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">

<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="manifest" href="manifest.webmanifest">

<title>Nutrition</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#0b3b75;
  overscroll-behavior-y:none;
}

.frame-wrap{
  display:flex;
  flex-direction:column;
  height:100vh;
  height:100dvh;
}

.safe-top{
  flex:0 0 auto;
  height:env(safe-area-inset-top);
  background:#0b3b75;
}

.safe-bottom{
  flex:0 0 auto;
  height:env(safe-area-inset-bottom);
  background:#f4f6f9;
}

iframe{
  flex:1 1 auto;
  width:100%;
  border:0;
  display:block;
}
</style>
</head>

<body>
<div class="frame-wrap">
  <div class="safe-top"></div>

  <iframe
    id="nutritionFrame"
    src="https://script.google.com/macros/s/AKfycbxLtAROcoXc5XswREIzB7s7ElCKIbaS-tVKDyz95h6kDk4ZKrZ6qda5S1jPjWNL0RBV/exec"
    title="Nutrition App"
    allow="clipboard-write; camera">
  </iframe>

  <div class="safe-bottom"></div>
</div>

<script>
(function () {
  const appUrl =
    'https://script.google.com/macros/s/AKfycbxLtAROcoXc5XswREIzB7s7ElCKIbaS-tVKDyz95h6kDk4ZKrZ6qda5S1jPjWNL0RBV/exec';

  const params = new URLSearchParams(window.location.search);
  const query = params.toString();

  let iframeUrl = appUrl;

  if (query) {
    iframeUrl += '?' + query;
  }

  document.getElementById('nutritionFrame').src = iframeUrl;
})();
</script>
</body>
</html>
